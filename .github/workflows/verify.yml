name: Verify AgendIA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agendia-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.23.0'
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - name: Prepare verified age for synthetic recovery tests
        shell: bash
        run: |
          agendia_age_context=$(mktemp -d "$RUNNER_TEMP/agendia-age.XXXXXX")
          agendia_age_container=""
          trap 'if [ -n "$agendia_age_container" ]; then docker rm "$agendia_age_container" >/dev/null; fi; rm -rf -- "$agendia_age_context"' EXIT
          mkdir -p "$agendia_age_context/scripts/lib"
          cp scripts/prepare-recovery-age.mjs "$agendia_age_context/scripts/"
          cp scripts/lib/recovery-age.lock.json "$agendia_age_context/scripts/lib/"
          # This isolated test-tool image never enters the production UI image.
          docker build -t agendia-recovery-age -f - "$agendia_age_context" <<'DOCKERFILE'
          FROM golang:1.26.1-alpine@sha256:2389ebfa5b7f43eeafbd6be0c3700cc46690ef842ad962f6c5bd6be49ed82039 AS sigsum-builder
          RUN go install sigsum.org/sigsum-go/cmd/sigsum-verify@v0.13.1
          FROM node:24.22.1-alpine@sha256:06d7adf3e0ef61a13f1d28682726366f97a15aa1888c934d3ecec86c33918b53 AS recovery-age
          COPY --from=sigsum-builder /go/bin/sigsum-verify /usr/local/bin/sigsum-verify
          COPY scripts/prepare-recovery-age.mjs /prepare/scripts/prepare-recovery-age.mjs
          COPY scripts/lib/recovery-age.lock.json /prepare/scripts/lib/recovery-age.lock.json
          RUN node /prepare/scripts/prepare-recovery-age.mjs --directory /usr/local/bin
          DOCKERFILE
          agendia_age_container=$(docker create agendia-recovery-age)
          docker cp "$agendia_age_container:/usr/local/bin/age" "$RUNNER_TEMP/age"
          docker cp "$agendia_age_container:/usr/local/bin/age-keygen" "$RUNNER_TEMP/age-keygen"
          chmod 755 "$RUNNER_TEMP/age" "$RUNNER_TEMP/age-keygen"
          echo "SARIN_TEST_AGE_PATH=$RUNNER_TEMP/age" >> "$GITHUB_ENV"
      - run: pnpm test
      - run: node --test pages-gateway/tests/*.test.mjs
      - run: pnpm --filter agendia-cloudflare-host --fail-if-no-match run check
      - run: pnpm run build
      - run: pnpm run build:pages
      - run: node scripts/deploy-agendia.mjs
      - name: Build and check the isolated UI image
        shell: bash
        run: |
          docker build -t agendia-ui:check .
          agendia_container=$(docker run -d --rm -p 127.0.0.1:3049:3000 agendia-ui:check)
          trap 'docker stop "$agendia_container" >/dev/null' EXIT
          node --input-type=module <<'NODE'
          const deadline = Date.now() + 90000;
          let ready = false;
          while (!ready && Date.now() < deadline) {
            try {
              const response = await fetch('http://127.0.0.1:3049/dashboard');
              ready = response.status === 200;
              await response.body?.cancel();
            } catch {}
            if (!ready) await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) throw new Error('UI container did not become ready');
          for (const path of ['/api/session', '/api/admin', '/admin', '/api/whatsapp/webhook', '/.well-known/jwks.json']) {
            const response = await fetch('http://127.0.0.1:3049' + path);
            await response.body?.cancel();
            if (response.status !== 404) throw new Error('UI exposed a retired backend route');
          }
          NODE

  deploy:
    needs: quality
    if: vars.AGENDIA_DEPLOY_ENABLED == 'true' && github.repository == 'andresleosan/AgendIA' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://agendia-app.pages.dev
    concurrency:
      group: agendia-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: '11.23.0'
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:pages
      - run: node scripts/deploy-agendia.mjs --deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
